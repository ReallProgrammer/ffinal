# Local database only. Run `npm run storage:dev` for local object-storage tests.
# Production uses the independent API Dockerfile and a private S3-compatible bucket.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
    ports: ['127.0.0.1:15432:5432']
    volumes: ['library-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U library -d library']
      interval: 3s
      retries: 20
volumes:
  library-db:
